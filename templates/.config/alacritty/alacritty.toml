[general]
import = [ "schemes/orangetree.toml" ]

[window]
dimensions = { columns = 113, lines = 25 }
padding = { x = 20, y = 20 }

[scrolling]
history = 100000

[font]
normal = { family = "CaskaydiaCove Nerd Font", style = "SemiBold" }
italic = { family = "CaskaydiaCove Nerd Font", style = "SemiBold Italic" }
size = 9.5
offset.y = 2
glyph_offset.y = 1

[colors]
draw_bold_text_with_bright_colors = true

[selection]
save_to_clipboard = true

[terminal]
shell = "wsl.exe"

[keyboard]
bindings = [
	{ key = "T", mods = "Control", action = "CreateNewWindow" }
]
